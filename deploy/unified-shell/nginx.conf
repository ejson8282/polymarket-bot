# 统一导航壳 · nginx 配置(施工包05·5C)
# ---------------------------------------------------------------------------
# 部署前用 sed 替换两个占位符(见 README.md):
#   TAILSCALE_IP        → 本机 Tailscale IP(如 100.122.255.98)
#   ACCOUNT_OPS_UPSTREAM → 核算台地址(如 127.0.0.1:8700;其路由自带
#                          /account-ops 前缀,无需路径改写)
# 路由约定:
#   /vardec/      → 127.0.0.1:8503(varia Streamlit,--server.baseUrlPath=vardec)
#   /alpha/       → 127.0.0.1:8501(pmbot Streamlit,--server.baseUrlPath=alpha)
#   /account-ops/ → 核算台(原样反代)
#   /             → 127.0.0.1:8600(总览聚合器,只读)
# 本文件是可独立 `nginx -t -c` 校验的完整配置;也可只摘 server{} 块并入现有配置。
# ---------------------------------------------------------------------------

worker_processes 1;
pid /tmp/unified-shell-nginx.pid;

events {
    worker_connections 256;
}

http {
    # Streamlit 依赖 WebSocket(/_stcore/stream),必须带 upgrade 头
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 3600s;   # Streamlit 长连接
    proxy_send_timeout 3600s;

    server {
        listen TAILSCALE_IP:80;
        server_name _;

        # Var/Decibel dashboard(Streamlit 以 --server.baseUrlPath=vardec 启动,
        # 自行处理 /vardec 前缀 → 反代不改写路径)
        location /vardec/ {
            proxy_pass http://127.0.0.1:8503;
        }

        # Polymarket / Latitude Alpha dashboard(--server.baseUrlPath=alpha)
        location /alpha/ {
            proxy_pass http://127.0.0.1:8501;
        }

        # 港股核算台(路由自带 /account-ops 前缀,原样反代,无需 rewrite)
        location /account-ops/ {
            proxy_pass http://ACCOUNT_OPS_UPSTREAM;
        }

        # 总览聚合器(FastAPI,只读)
        location / {
            proxy_pass http://127.0.0.1:8600;
        }
    }
}
