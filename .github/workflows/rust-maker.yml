name: Rust maker core

on:
  pull_request:
    paths:
      - "rust-maker/**"
      - ".github/workflows/rust-maker.yml"
  push:
    branches: [main]
    paths:
      - "rust-maker/**"
      - ".github/workflows/rust-maker.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-maker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
