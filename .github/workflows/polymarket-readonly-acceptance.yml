name: Polymarket read-only acceptance

on:
  pull_request:
    paths:
      - "signer_server/**"
      - "platforms/polymarket/maker/remote_signer.py"
      - "platforms/polymarket/maker/aggressive_acceptance.py"
      - "platforms/polymarket/maker/small_cap_observation.py"
      - "platforms/polymarket/maker/account_roster.py"
      - "platforms/polymarket/maker/account_profiles.py"
      - "platforms/polymarket/maker/deploy_aggressive_runtime.py"
      - "tests/test_polymarket_signer*.py"
      - "tests/test_polymarket_aggressive_acceptance.py"
      - "tests/test_polymarket_small_cap_observation.py"
      - ".github/workflows/polymarket-readonly-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "signer_server/**"
      - "platforms/polymarket/maker/remote_signer.py"
      - "platforms/polymarket/maker/aggressive_acceptance.py"
      - "platforms/polymarket/maker/small_cap_observation.py"
      - "platforms/polymarket/maker/account_roster.py"
      - "platforms/polymarket/maker/account_profiles.py"
      - "platforms/polymarket/maker/deploy_aggressive_runtime.py"
      - "tests/test_polymarket_signer*.py"
      - "tests/test_polymarket_aggressive_acceptance.py"
      - "tests/test_polymarket_small_cap_observation.py"
      - ".github/workflows/polymarket-readonly-acceptance.yml"

permissions:
  contents: read

jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: >-
          python -m pip install pytest==9.0.3 py_clob_client_v2==1.0.0
          py-clob-client==0.34.6 requests==2.33.1 httpx==0.28.1
          fastapi==0.116.1 uvicorn==0.35.0
      - name: Existing-credentials and aggressive account acceptance
        run: >-
          python -m pytest -q
          tests/test_polymarket_signer_transport.py
          tests/test_polymarket_signer_readonly.py
          tests/test_polymarket_aggressive_acceptance.py
          tests/test_polymarket_small_cap_observation.py
          tests/test_polymarket_account_profiles.py
          tests/test_polymarket_account_roster.py
