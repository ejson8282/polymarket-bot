      - "platforms/polymarket/maker/aggressive_market_selector.py"
      - "platforms/polymarket/maker/aggressive_recovery.py"
      - "platforms/polymarket/maker/sponsored_guard.py"
      - "platforms/polymarket/maker/order_scoring_observer.py"
      - "tests/test_polymarket_deploy_release.py"
      - "tests/test_polymarket_aggressive_deploy.py"
      - "tests/test_polymarket_aggressive_guardrails.py"
      - "tests/test_polymarket_order_scoring_observer.py"
      - "tests/test_polymarket_release_guard.py"
      - "tests/test_polymarket_maker_engine.py"
      - "tests/test_polymarket_exchange_maintenance.py"
      - "tests/test_polymarket_account_roster.py"
      - "tests/test_polymarket_account_profiles.py"
      - "tests/test_polymarket_multi_runner.py"
      - "tests/test_polymarket_quote_feasibility.py"
      - "tests/test_polymarket_stable_market_lifecycle.py"
      - "tests/test_polymarket_stable_rotation_commands.py"
      - "tests/test_polymarket_stable_rotation_planner.py"
      - "tests/test_polymarket_reward_observer.py"
      - "tests/test_polymarket_reward_fast_lane.py"
      - "tests/test_polymarket_reward_shadow_allocator.py"
      - "tests/test_polymarket_aggressive_market_selector.py"
      - "tests/test_polymarket_sponsored_guard.py"
      - ".github/workflows/polymarket-python-safety.yml"

permissions:
  contents: read

concurrency:
  group: polymarket-python-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest==9.0.3
          py_clob_client_v2==1.0.0
          requests==2.33.1
          websockets==15.0.1
      - name: Test release and passive-maker safety
        run: >-
          python -m pytest -q
          tests/test_polymarket_deploy_release.py
          tests/test_polymarket_aggressive_deploy.py
          tests/test_polymarket_aggressive_guardrails.py
          tests/test_polymarket_order_scoring_observer.py
          tests/test_polymarket_release_guard.py
          tests/test_polymarket_maker_engine.py
          tests/test_polymarket_exchange_maintenance.py
          tests/test_polymarket_account_roster.py
          tests/test_polymarket_account_profiles.py
          tests/test_polymarket_multi_runner.py
          tests/test_polymarket_quote_feasibility.py
          tests/test_polymarket_stable_market_lifecycle.py
          tests/test_polymarket_stable_rotation_commands.py
          tests/test_polymarket_stable_rotation_planner.py
          tests/test_polymarket_reward_observer.py
          tests/test_polymarket_reward_fast_lane.py
          tests/test_polymarket_reward_shadow_allocator.py
          tests/test_polymarket_aggressive_market_selector.py
          tests/test_polymarket_sponsored_guard.py
